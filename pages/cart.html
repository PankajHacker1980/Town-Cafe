<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Your Cart — Town Coffee</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      background-color: #FAF7F2;
      color: #1C1917;
      font-family: 'Plus Jakarta Sans', sans-serif;
      padding-bottom: 120px;
      margin: 0;
    }
    .btn-active:active {
      transform: scale(0.95);
    }
  </style>
</head>
<body>

  <!-- Top Navigation Header -->
  <header style="padding: 16px 20px; display: flex; align-items: center; justify-content: space-between; background: #FAF7F2; position: sticky; top: 0; z-index: 100; border-bottom: 1px solid rgba(60, 42, 33, 0.05);">
    <a href="customer.html" class="btn-active" style="text-decoration: none; color: #1C1917; display: flex; align-items: center; justify-content: center; width: 36px; height: 36px; background: #FFFFFF; border-radius: 50%; border: 1px solid rgba(60, 42, 33, 0.08);">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <line x1="19" y1="12" x2="5" y2="12"></line>
        <polyline points="12 19 5 12 12 5"></polyline>
      </svg>
    </a>
    <h1 style="font-size: 18px; font-weight: 800; color: #1C1917; margin: 0;">Your Order</h1>
    <button onclick="clearCart()" class="btn-active" style="background: none; border: none; font-size: 12px; font-weight: 700; color: #EF4444; cursor: pointer;">Clear</button>
  </header>

  <!-- Items Container -->
  <main style="padding: 16px;">
    <div id="cart-items-list" style="display: flex; flex-direction: column; gap: 12px;"></div>

    <!-- Empty State -->
    <div id="empty-cart-view" style="display: none; text-align: center; padding: 60px 20px;">
      <div style="font-size: 48px; margin-bottom: 12px;">☕</div>
      <h3 style="font-size: 18px; font-weight: 800; color: #1C1917; margin: 0;">Your cart is empty</h3>
      <p style="font-size: 13px; color: #78716C; margin: 8px 0 20px 0;">Looks like you haven't added any delicious items yet.</p>
      <a href="customer.html" class="btn-active" style="display: inline-block; background: #3C2A21; color: white; text-decoration: none; padding: 12px 24px; border-radius: 14px; font-size: 13px; font-weight: 700;">Explore Menu</a>
    </div>

    <!-- Order Summary Box -->
    <section id="cart-summary-section" style="margin-top: 24px; background: #FFFFFF; border-radius: 20px; padding: 18px; border: 1px solid rgba(60, 42, 33, 0.06);">
      <h4 style="font-size: 14px; font-weight: 800; color: #1C1917; margin: 0 0 12px 0;">Payment Details</h4>
      
      <div style="display: flex; justify-content: space-between; font-size: 13px; color: #78716C; margin-bottom: 8px;">
        <span>Item Total</span>
        <span id="subtotal-val" style="color: #1C1917; font-weight: 600;">₹0</span>
      </div>
      <div style="display: flex; justify-content: space-between; font-size: 13px; color: #78716C; margin-bottom: 8px;">
        <span>Taxes & Charges (5%)</span>
        <span id="tax-val" style="color: #1C1917; font-weight: 600;">₹0</span>
      </div>

      <div style="height: 1px; background: rgba(60, 42, 33, 0.08); margin: 12px 0;"></div>

      <div style="display: flex; justify-content: space-between; font-size: 15px; font-weight: 800; color: #1C1917;">
        <span>Grand Total</span>
        <span id="grandtotal-val" style="color: #3C2A21;">₹0</span>
      </div>
    </section>
  </main>

  <!-- Checkout Sticky Bottom Bar -->
  <div id="checkout-bar" style="position: fixed; bottom: 0; left: 0; right: 0; background: #FFFFFF; border-top: 1px solid rgba(60, 42, 33, 0.08); padding: 14px 20px; z-index: 1000;">
    <button onclick="placeOrder()" class="btn-active" style="width: 100%; background: #3C2A21; color: #FFFFFF; border: none; padding: 16px; border-radius: 16px; font-size: 15px; font-weight: 800; cursor: pointer; display: flex; justify-content: space-between; align-items: center;">
      <span>Place Order</span>
      <span id="checkout-total-btn">₹0 &rarr;</span>
    </button>
  </div>

  <script src="script.js"></script>
  <script>
    const fallbackImg = "https://images.unsplash.com/photo-1509042239860-f550ce710b93?auto=format&fit=crop&w=500&q=80";

    function getCart() {
      if (window.TownCafe && typeof window.TownCafe.getCart === 'function') {
        const c = window.TownCafe.getCart();
        if (c && c.length > 0) return c;
      }
      try {
        return JSON.parse(localStorage.getItem('town_cafe_cart') || '[]');
      } catch (e) {
        return [];
      }
    }

    function saveCart(cart) {
      localStorage.setItem('town_cafe_cart', JSON.stringify(cart));
      renderCart();
    }

    function changeQty(productId, delta) {
      let cart = getCart();
      const item = cart.find(i => String(i.id) === String(productId));

      if (item) {
        item.quantity = (item.quantity || 1) + delta;
        if (item.quantity <= 0) {
          cart = cart.filter(i => String(i.id) !== String(productId));
        }
      }

      saveCart(cart);
    }

    function clearCart() {
      saveCart([]);
    }

    function renderCart() {
      const cart = getCart();
      const listElem = document.getElementById('cart-items-list');
      const emptyElem = document.getElementById('empty-cart-view');
      const summaryElem = document.getElementById('cart-summary-section');
      const checkoutBar = document.getElementById('checkout-bar');

      if (!cart || cart.length === 0) {
        listElem.style.display = 'none';
        summaryElem.style.display = 'none';
        checkoutBar.style.display = 'none';
        emptyElem.style.display = 'block';
        return;
      }

      emptyElem.style.display = 'none';
      listElem.style.display = 'flex';
      summaryElem.style.display = 'block';
      checkoutBar.style.display = 'block';

      let subtotal = 0;

      listElem.innerHTML = cart.map(item => {
        const qty = item.quantity || 1;
        const price = Number(item.price || 0);
        const itemTotal = price * qty;
        subtotal += itemTotal;

        return `
          <div style="background: #FFFFFF; border-radius: 16px; padding: 12px; border: 1px solid rgba(60, 42, 33, 0.06); display: flex; align-items: center; gap: 12px;">
            <img src="${item.image || fallbackImg}" 
                 onerror="this.onerror=null; this.src='${fallbackImg}';" 
                 style="width: 64px; height: 64px; border-radius: 12px; object-fit: cover;">

            <div style="flex-grow: 1;">
              <h4 style="font-size: 14px; font-weight: 700; color: #1C1917; margin: 0;">${item.name}</h4>
              <p style="font-size: 13px; font-weight: 800; color: #3C2A21; margin: 4px 0 0 0;">₹${price}</p>
            </div>

            <div style="display: flex; align-items: center; gap: 10px; background: #FAF7F2; padding: 6px 10px; border-radius: 12px; border: 1px solid rgba(60, 42, 33, 0.08);">
              <button onclick="changeQty('${item.id}', -1)" class="btn-active" style="background: none; border: none; font-size: 16px; font-weight: 800; color: #3C2A21; cursor: pointer;">-</button>
              <span style="font-size: 13px; font-weight: 800; color: #1C1917; min-width: 14px; text-align: center;">${qty}</span>
              <button onclick="changeQty('${item.id}', 1)" class="btn-active" style="background: none; border: none; font-size: 16px; font-weight: 800; color: #3C2A21; cursor: pointer;">+</button>
            </div>
          </div>
        `;
      }).join('');

      const tax = Math.round(subtotal * 0.05);
      const grandTotal = subtotal + tax;

      document.getElementById('subtotal-val').innerText = `₹${subtotal}`;
      document.getElementById('tax-val').innerText = `₹${tax}`;
      document.getElementById('grandtotal-val').innerText = `₹${grandTotal}`;
      document.getElementById('checkout-total-btn').innerText = `₹${grandTotal} →`;
    }

    function placeOrder() {
      alert("🎉 Order placed successfully for Table 12!");
      saveCart([]);
      window.location.href = "tracking.html";
    }

    window.addEventListener('load', renderCart);
  </script>
</body>
</html>
