<!DOCTYPE html>
<html lang="en">
<head>

  <!-- Script setup & dynamic behavior -->
  <script src="script.js"></script>

  <script>
    let activeCategory = 'All';
    const fallbackImg = "https://images.unsplash.com/photo-1509042239860-f550ce710b93?auto=format&fit=crop&w=500&q=80";

    const defaultFallbackMenu = [
      { id: '1', name: 'Hazelnut Latte', category: 'Coffee', price: 180, description: 'Rich espresso blended with velvety steamed milk and sweet hazelnut syrup.', image: 'https://images.unsplash.com/photo-1572442388796-11668a67e53d?auto=format&fit=crop&w=500&q=80', rating: 4.8, prepTime: '8 min', isBestseller: true, isVeg: true },
      { id: '2', name: 'Cappuccino Premium', category: 'Coffee', price: 160, description: 'Classic double espresso topped with rich, thick layer of frothed warm milk foam.', image: 'https://images.unsplash.com/photo-1534778101976-62847782c213?auto=format&fit=crop&w=500&q=80', rating: 4.6, prepTime: '7 min', isBestseller: true, isVeg: true },
      { id: '3', name: 'Grilled Cheese Sandwich', category: 'Sandwiches', price: 210, description: 'Melted cheddar and mozzarella stuffed inside toasted artisan sourdough bread.', image: 'https://images.unsplash.com/photo-1528735602780-2552fd46c7af?auto=format&fit=crop&w=500&q=80', rating: 4.7, prepTime: '12 min', isBestseller: true, isVeg: true },
      { id: '4', name: 'Creamy Alfredo Pasta', category: 'Pasta', price: 280, description: 'Fettuccine tossed in rich garlic parmesan cream sauce served with garlic bread.', image: 'https://images.unsplash.com/photo-1621996346565-e3d5d6281288?auto=format&fit=crop&w=500&q=80', rating: 4.9, prepTime: '15 min', isBestseller: false, isVeg: true },
      { id: '5', name: 'Tiramisu Slice', category: 'Desserts', price: 220, description: 'Classic Italian dessert layer cake soaked in espresso with mascarpone cream.', image: 'https://images.unsplash.com/photo-1571877227200-a0d98ea607e9?auto=format&fit=crop&w=500&q=80', rating: 4.9, prepTime: '5 min', isBestseller: true, isVeg: true }
    ];

    // Self-contained state storage so state updates dynamically without breaking
    function getCartData() {
      try {
        return JSON.parse(localStorage.getItem('town_cafe_cart') || '[]');
      } catch (e) {
        return [];
      }
    }

    function saveCartData(cart) {
      localStorage.setItem('town_cafe_cart', JSON.stringify(cart));
      updateUIHeaderAndCartBar();
    }

    function getFavoritesData() {
      try {
        return JSON.parse(localStorage.getItem('town_cafe_favs') || '[]');
      } catch (e) {
        return [];
      }
    }

    function saveFavoritesData(favs) {
      localStorage.setItem('town_cafe_favs', JSON.stringify(favs));
    }

    function fetchMenuData() {
      if (window.TownCafe && typeof window.TownCafe.getMenu === 'function') {
        const m = window.TownCafe.getMenu();
        if (m && m.length > 0) return m;
      }
      return defaultFallbackMenu;
    }

    // Direct Handler: Add To Cart
    function handleAddToCart(productId) {
      if (window.TownCafe && typeof window.TownCafe.addToCart === 'function') {
        window.TownCafe.addToCart(productId);
        updateUIHeaderAndCartBar();
        return;
      }

      // Local fallback logic
      const menu = fetchMenuData();
      const item = menu.find(i => String(i.id) === String(productId));
      if (!item) return;

      const cart = getCartData();
      const existing = cart.find(c => String(c.id) === String(productId));

      if (existing) {
        existing.quantity = (existing.quantity || 1) + 1;
      } else {
        cart.push({ ...item, quantity: 1 });
      }

      saveCartData(cart);
    }

    // Direct Handler: Favorite Toggle
    function handleToggleFav(productId, btnElem) {
      let isFav = false;

      if (window.TownCafe && typeof window.TownCafe.toggleFavorite === 'function') {
        isFav = window.TownCafe.toggleFavorite(productId);
      } else {
        let favs = getFavoritesData();
        const idStr = String(productId);
        if (favs.includes(idStr)) {
          favs = favs.filter(id => id !== idStr);
          isFav = false;
        } else {
          favs.push(idStr);
          isFav = true;
        }
        saveFavoritesData(favs);
      }

      const svg = btnElem.querySelector('svg');
      if (svg) {
        svg.setAttribute('fill', isFav ? '#EF4444' : 'none');
        svg.setAttribute('stroke', isFav ? '#EF4444' : '#1C1917');
      }
    }

    function requestService(type) {
      if (window.TownCafe && typeof window.TownCafe.requestService === 'function') {
        window.TownCafe.requestService(type);
      } else {
        alert(`${type} service has been requested for Table 12!`);
      }
    }

    function updateUIHeaderAndCartBar() {
      let cart = [];
      if (window.TownCafe && typeof window.TownCafe.getCart === 'function') {
        cart = window.TownCafe.getCart();
      } else {
        cart = getCartData();
      }

      const totalItems = cart.reduce((sum, item) => sum + (item.quantity || 1), 0);
      const totalPrice = cart.reduce((sum, item) => sum + (Number(item.price || 0) * (item.quantity || 1)), 0);

      document.querySelectorAll('.cart-badge-count').forEach(badge => {
        badge.innerText = totalItems;
      });

      const countTxt = document.getElementById('floating-cart-count-txt');
      if (countTxt) countTxt.innerText = `${totalItems} ${totalItems === 1 ? 'Item' : 'Items'}`;

      const totalTxt = document.getElementById('floating-cart-total-txt');
      if (totalTxt) totalTxt.innerText = `₹${totalPrice.toFixed(0)}`;
    }

    function renderFoodCards(items) {
      const container = document.getElementById('menu-grid');
      let favorites = [];
      
      if (window.TownCafe && typeof window.TownCafe.getFavorites === 'function') {
        favorites = window.TownCafe.getFavorites();
      } else {
        favorites = getFavoritesData();
      }
      
      if (!items || items.length === 0) {
        container.innerHTML = `
          <div style="grid-column: 1 / -1; text-align: center; padding: 40px 10px;">
            <p style="font-size: 14px; color: #78716C; font-weight: 600;">No delicious items match your filter!</p>
          </div>
        `;
        return;
      }

      container.innerHTML = items.map(item => {
        const isLiked = favorites.map(String).includes(String(item.id));
        const safePrice = Number(item.price || 0).toFixed(0);
        
        return `
        <div style="background: #FFFFFF; border-radius: 20px; overflow: hidden; border: 1px solid rgba(60, 42, 33, 0.06); display: flex; flex-direction: column; justify-content: space-between; box-shadow: 0 4px 16px rgba(0,0,0,0.03);">
          
          <div style="position: relative; background: #EFE8DE;">
            <img src="${item.image}" 
                 onerror="this.onerror=null; this.src='${fallbackImg}';"
                 alt="${item.name}" 
                 style="width: 100%; height: 130px; object-fit: cover; display: block;">
            
            ${item.isBestseller ? `
              <span style="position: absolute; top: 10px; left: 10px; background: #D4A373; color: white; padding: 3px 8px; border-radius: 8px; font-size: 9px; font-weight: 700;">Bestseller</span>
            ` : item.isVeg ? `
              <span style="position: absolute; top: 10px; left: 10px; background: white; border: 1px solid #16A34A; width: 14px; height: 14px; border-radius: 3px; display: flex; align-items: center; justify-content: center;">
                <span style="width: 6px; height: 6px; background: #16A34A; border-radius: 50%;"></span>
              </span>
            ` : ''}

            <button onclick="handleToggleFav('${item.id}', this)" class="btn-active" style="position: absolute; top: 10px; right: 10px; background: rgba(255, 255, 255, 0.9); border: none; border-radius: 50%; width: 26px; height: 26px; display: flex; align-items: center; justify-content: center; cursor: pointer;">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="${isLiked ? '#EF4444' : 'none'}" stroke="${isLiked ? '#EF4444' : '#1C1917'}" stroke-width="2">
                <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path>
              </svg>
            </button>
          </div>

          <div style="padding: 12px; flex-grow: 1; display: flex; flex-direction: column; justify-content: space-between;">
            <div>
              <h4 style="font-size: 14px; font-weight: 700; color: #1C1917; margin: 0;">${item.name}</h4>
              <p style="font-size: 11px; color: #78716C; margin: 4px 0 8px 0; line-height: 1.3; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;">${item.description}</p>
            </div>

            <div>
              <div style="display: flex; align-items: center; gap: 8px; margin-bottom: 10px;">
                <span style="font-size: 11px; font-weight: 700; color: #1C1917; display: flex; align-items: center; gap: 2px;">
                  <span style="color: #EAB308;">★</span> ${item.rating || 4.5}
                </span>
                <span style="font-size: 11px; color: #78716C;">⏱️ ${item.prepTime || '10 min'}</span>
              </div>

              <div style="display: flex; justify-content: space-between; align-items: center;">
                <span style="font-size: 15px; font-weight: 800; color: #1C1917;">₹${safePrice}</span>
                <button onclick="handleAddToCart('${item.id}')" class="btn-active" style="background: #3C2A21; color: white; border: none; border-radius: 50%; width: 28px; height: 28px; font-size: 16px; font-weight: 700; display: flex; align-items: center; justify-content: center; cursor: pointer;">
                  +
                </button>
              </div>
            </div>

          </div>
        </div>
      `;
      }).join('');
    }

    function filterCategory(category, element) {
      activeCategory = category;
      document.querySelectorAll('.cat-pill').forEach(el => {
        el.querySelector('.cat-icon-bg').style.background = '#F3ECE2';
        el.querySelector('.cat-icon-bg').style.color = '#3C2A21';
        el.querySelector('span').style.color = '#78716C';
        el.querySelector('span').style.fontWeight = '600';
      });

      element.querySelector('.cat-icon-bg').style.background = '#3C2A21';
      element.querySelector('.cat-icon-bg').style.color = '#FFFFFF';
      element.querySelector('span').style.color = '#1C1917';
      element.querySelector('span').style.fontWeight = '700';

      applyFilters();
    }

    function toggleBestsellers() {
      const checkbox = document.getElementById('bestseller-toggle');
      const bg = document.getElementById('toggle-bg');
      const circle = document.getElementById('toggle-circle');
      
      if (checkbox.checked) {
        bg.style.backgroundColor = '#3C2A21';
        circle.classList.add('active-toggle');
      } else {
        bg.style.backgroundColor = '#E7E5E4';
        circle.classList.remove('active-toggle');
      }
      applyFilters();
    }

    function clearSearch() {
      document.getElementById('menu-search').value = '';
      applyFilters();
    }

    function applyFilters() {
      const menu = fetchMenuData();
      const searchVal = (document.getElementById('menu-search').value || '').toLowerCase();
      const onlyBestsellers = document.getElementById('bestseller-toggle').checked;

      const filtered = menu.filter(item => {
        const matchesCategory = (activeCategory === 'All') || item.category.toLowerCase().includes(activeCategory.toLowerCase());
        const matchesSearch = item.name.toLowerCase().includes(searchVal) || item.description.toLowerCase().includes(searchVal);
        const matchesBestseller = !onlyBestsellers || item.isBestseller;
        return matchesCategory && matchesSearch && matchesBestseller;
      });

      renderFoodCards(filtered);
    }

    // Startup Initialization
    window.addEventListener('load', () => {
      applyFilters();
      updateUIHeaderAndCartBar();
    });
    
    // Safety fallback init
    setTimeout(() => {
      applyFilters();
      updateUIHeaderAndCartBar();
    }, 150);
  </script>
</body>
</html>
